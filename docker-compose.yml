services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cti-falkordb
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    environment:
      REDIS_ARGS: "--appendonly yes"
      FALKORDB_ARGS: "THREAD_COUNT 2"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  falkordb_data:
    driver: local
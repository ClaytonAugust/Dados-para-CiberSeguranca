[project]
name = "cti-graphrag"
version = "0.1.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs the real FalkorDB or LLM (deselect with -m \"not integration\")",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
